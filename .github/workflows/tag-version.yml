name: Tag package version

on:
  push:
    branches: [main]
    paths: [pubspec.yaml]

jobs:
  tag:
    if: ${{ !github.event.created && !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Tag the pushed commit when the version increases
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version_at() {
            git show "$1:pubspec.yaml" | ruby -ryaml -e '
              version = YAML.safe_load(STDIN.read).fetch("version")
              abort "Expected a stable X.Y.Z version" unless
                version.is_a?(String) && version.match?(/\A(?:0|[1-9]\d*)(?:\.(?:0|[1-9]\d*)){2}\z/)
              puts version
            '
          }

          previous=$(version_at "$BEFORE_SHA")
          version=$(version_at "$GITHUB_SHA")
          if [[ "$version" == "$previous" ]]; then
            echo "Version unchanged: $version"
            exit 0
          fi
          if ! ruby -rrubygems/version -e 'exit(Gem::Version.new(ARGV[1]) > Gem::Version.new(ARGV[0]))' "$previous" "$version"; then
            echo "::error::Version must increase ($previous -> $version)"
            exit 1
          fi

          tag="refs/tags/$version"
          if git show-ref --verify --quiet "$tag"; then
            if [[ "$(git rev-parse "${tag}^{commit}")" == "$GITHUB_SHA" ]]; then
              echo "Tag $version already points to this commit"
              exit 0
            fi
            echo "::error::Tag $version already points to a different commit"
            exit 1
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$version" "$GITHUB_SHA" -m "Release $version"
          git -c push.followTags=false push origin "$tag:$tag"
